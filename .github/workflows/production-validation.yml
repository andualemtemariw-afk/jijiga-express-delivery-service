name: Production Validation

concurrency:
  group: production-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Root typecheck
        run: npm run lint
      - name: Root production build
        run: npm run build
      - name: Install Functions dependencies
        run: npm --prefix functions ci
      - name: Functions typecheck
        run: npm --prefix functions run lint
      - name: Functions production build
        run: npm --prefix functions run build

      - name: Set up Java 21 for Firebase Emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Firebase rules smoke tests
        run: npm run test:rules

  root-dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Root dependency audit
        run: npm audit --audit-level=high

  functions-dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install Functions dependencies
        run: npm --prefix functions ci
      - name: Functions dependency audit
        run: npm --prefix functions audit --audit-level=high
