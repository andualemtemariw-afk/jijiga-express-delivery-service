name: Production Validation

concurrency:
  group: production-validation-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Root typecheck
        run: npm run lint
      - name: Root production build
        run: npm run build
      - name: Telegram authentication unit tests
        run: npm run test:telegram
      # The functions/ folder is retained only for firebase-admin emulator test support.
      # There is no Cloud Functions source or deploy target in this Spark-compatible branch.
      - name: Install Firebase Admin emulator test dependencies
        run: npm --prefix functions ci

      - name: Set up Java 21 for Firebase Emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Firebase rules smoke tests
        run: timeout 10m npm run test:rules

  root-dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Root dependency audit
        run: npm audit --audit-level=high
