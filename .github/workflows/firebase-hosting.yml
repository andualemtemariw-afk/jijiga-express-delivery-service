name: Firebase Hosting deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_ENABLE_DEMO_SANDBOX: 'false'
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment configuration
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        shell: bash
        run: |
          missing=0
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo "::error::Missing GitHub Actions secret FIREBASE_SERVICE_ACCOUNT. Add the service-account JSON as a secret for the production environment."
            missing=1
          fi
          if [[ -z "$VITE_GOOGLE_MAPS_API_KEY" ]]; then
            echo "::error::Missing GitHub Actions secret VITE_GOOGLE_MAPS_API_KEY. Add the restricted Google Maps browser API key for the production environment."
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            echo "Configure secrets at Settings > Environments > production > Environment secrets, then rerun this workflow."
            exit 1
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: sunny-discipline-hvd6f
          channelId: live
