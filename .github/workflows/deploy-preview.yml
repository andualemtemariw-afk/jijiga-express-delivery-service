name: Deploy Firebase Hosting PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-preview.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: firebase-hosting-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build_and_preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: preview
    env:
      VITE_ENABLE_DEMO_SANDBOX: 'false'
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test EEU workflow
        run: npm run test:eeu

      - name: Build web app
        run: npm run build

      - name: Deploy PR preview (not live)
        if: ${{ vars.ENABLE_FIREBASE_HOSTING_PREVIEW == 'true' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: sunny-discipline-hvd6f
          expires: 7d
