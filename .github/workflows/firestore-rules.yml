name: Firestore rules tests

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.rules-test.json'
      - 'firebase.json'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'functions/package.json'
      - 'functions/package-lock.json'
      - '.github/workflows/firestore-rules.yml'
  push:
    branches: [main, master]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.rules-test.json'
      - 'firebase.json'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'functions/package.json'
      - 'functions/package-lock.json'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15.32.1

      - name: Install root dependencies
        run: npm ci

      # Emulator test harness uses firebase-admin from functions/package.json.
      # These dependencies are test-only; this workflow never deploys Cloud Functions.
      - name: Install Firebase Admin emulator test dependencies
        run: npm --prefix functions ci

      - name: Run Firestore rules tests
        run: npm run test:rules
