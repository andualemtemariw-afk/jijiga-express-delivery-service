name: Feature Verification

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, rules, accounting, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Lint (currently aliases TypeScript typecheck)
        run: npm run lint

      - name: Accounting regression tests
        run: npm run test:accounting

      - name: Firestore rules emulator tests
        run: npm run test:rules

      - name: Production bundle
        run: npm run build

      - name: Report bundle sizes
        run: du -ah dist/assets | sort -h | tail -20
